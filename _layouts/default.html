<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Computação Visual</title>
    <style>
        /* Fundo principal com as bolinhas rosa */
        body {
            background-color: #ffe6f2;
            background-image: radial-gradient(#ffb3d9 15%, transparent 16%);
            background-size: 20px 20px;
            font-family: Arial, sans-serif; 
            margin: 0;
            padding: 20px;
            color: #333;
        }

        /* Container que segura tudo */
        .wrapper {
            max-width: 900px;
            margin: 0 auto;
        }

        /* O Banner do Gatinho no topo */
        .header-banner {
            width: 100%;
            height: 200px;
            background-image: url('images/GatinhoCompVisual.png'); /* Caminho corrigido! */
            background-size: cover;
            background-position: center;
            margin-bottom: 20px;
            background-color: #ffccdd; 
        }

        /* Estrutura de três colunas usando Flexbox */
        .layout {
            display: flex;
            gap: 20px;
            align-items: flex-start;
        }

        /* Coluna da Esquerda (Perfil) */
        .sidebar-left {
            width: 200px;
            flex-shrink: 0;
            background-color: rgba(255, 255, 255, 0.5); 
        }

        .profile-pic {
            width: 100%;
            display: block;
            margin-bottom: 5px;
        }

        /* Coluna do Meio (Conteúdo Principal) */
        .main-content {
            flex-grow: 1;
            background-color: #ffccdd; 
            min-height: 500px; 
        }

        /* Coluna da Direita (Atividades) */
        .sidebar-right {
            width: 250px;
            flex-shrink: 0;
        }

        /* Estilo comum para as barras verdes de título */
        .title-bar {
            background-color: #66cc33; 
            color: white;
            text-align: center;
            padding: 8px 0;
            font-weight: bold;
            font-size: 14px;
            margin: 0;
        }

        /* Texto abaixo da foto de perfil */
        .profile-info {
            font-size: 12px;
            padding: 10px 5px;
            line-height: 1.5;
        }

        /* --- ESTILO DA COLUNA DO MEIO (Lista Retrô com Quadrados) --- */
        .retro-list {
            padding: 15px 15px 15px 30px; 
            list-style-type: square; 
            color: #ff007f; 
            font-family: "Comic Sans MS", "Chalkboard SE", sans-serif;
            font-size: 16px;
            margin: 0;
        }

        .retro-list li { margin-bottom: 10px; }
        
        .retro-list a { color: #cc00cc; text-decoration: none; font-weight: bold; }
        
        .retro-list a:hover { text-decoration: underline; color: #ff1493; }
        
        .retro-list span { color: #ff007f; font-weight: normal; }

        /* --- ESTILO DA COLUNA DA DIREITA (Botões Gordinhos + Texto) --- */
        .activities-list {
            list-style: none; padding: 15px 10px; margin: 0;
        }

        .activities-list li {
            margin-bottom: 15px; display: flex; align-items: center; gap: 10px;
            font-family: "Comic Sans MS", "Chalkboard SE", sans-serif;
            color: #cc00cc; font-size: 14px; font-weight: bold;
        }

        /* O Botão Brilhante (Glossy) */
        .activities-list a {
            display: inline-block; width: 40px; height: 40px; line-height: 40px;
            background-color: #ffb3d9; color: #66cc33; text-decoration: none;
            font-size: 20px; font-weight: bold; text-align: center;
            border-radius: 8px; border: 2px solid #ff99cc;
            box-shadow: inset 0 5px 10px rgba(255,255,255,0.8), 2px 2px 5px rgba(0,0,0,0.2);
            flex-shrink: 0; 
        }

        .activities-list a:hover { background-color: #ff99cc; }

    </style>
</head>
<body>

<div class="wrapper">
    <!-- Banner Superior -->
    <div class="header-banner"></div>

    <!-- Layout em Colunas -->
    <div class="layout">
        
        <!-- Coluna Esquerda: Sobre Mim -->
        <div class="sidebar-left">
            <img src="images/avatar-pink.jpg" alt="Avatar Rosa" class="profile-pic"> <!-- Caminho corrigido! -->
            <div class="title-bar">Sobre mim:</div>
            <div class="profile-info">
                Nome: Júlia Andrade<br>
                RA: 10428513
            </div>
        </div>

        <!-- Coluna Central: Anotações -->
        <div class="main-content">
            <div class="title-bar">Anotações</div>
            <!-- Div duplicada removida! -->
            <div style="padding: 15px; line-height: 1.6;">
                {{ content }}
            </div>
        </div>

        <!-- Coluna Direita: Atividades -->
        <div class="sidebar-right">
            <div class="title-bar">Atividades</div>
            
            <ul class="activities-list">
                <li><a href="#">1</a> Computação Visual?</li>
                <li><a href="#">2</a> Computação Gráfica, Compugrafia ou Compugráfica?</li>
                <li><a href="#">3</a> Atividade 3</li>
            </ul>
        </div>

    </div>
</div>

</body>
</html>
