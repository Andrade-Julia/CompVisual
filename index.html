<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Computação Visual</title>
    <style>
        /* Fundo principal com as bolinhas rosa */
        body {
            background-color: #ffe6f2;
            background-image: radial-gradient(#ffb3d9 15%, transparent 16%);
            background-size: 20px 20px;
            font-family: Arial, sans-serif; 
            margin: 0;
            padding: 20px;
            color: #333;
        }

        /* Container que segura tudo */
        .wrapper {
            max-width: 900px;
            margin: 0 auto;
        }

        /* O Banner do Gatinho no topo */
        .header-banner {
            width: 100%;
            height: 200px;
            background-image: url('images/GatinhoCompVisual.png');
            background-size: cover;
            background-position: center;
            margin-bottom: 20px;
            background-color: #ffccdd; 
        }

        /* Estrutura de três colunas usando Flexbox */
        .layout {
            display: flex;
            gap: 20px;
            align-items: flex-start;
        }

        /* Coluna da Esquerda (Perfil) */
        .sidebar-left {
            width: 200px;
            flex-shrink: 0;
            background-color: rgba(255, 255, 255, 0.5); 
        }

        .profile-pic {
            width: 100%;
            display: block;
            margin-bottom: 5px;
        }

        /* Coluna do Meio (Conteúdo Principal) */
        .main-content {
            flex-grow: 1;
            background-color: #ffccdd; 
            min-height: 500px; 
        }

        /* Coluna da Direita (Atividades) */
        .sidebar-right {
            width: 150px;
            flex-shrink: 0;
        }

        /* Estilo comum para as barras verdes de título */
        .title-bar {
            background-color: #66cc33; 
            color: white;
            text-align: center;
            padding: 8px 0;
            font-weight: bold;
            font-size: 14px;
            margin: 0;
        }

        /* Texto abaixo da foto de perfil */
        .profile-info {
            font-size: 12px;
            padding: 10px 5px;
            line-height: 1.5;
        }

        /* --- O SEU ESTILO DE LISTA RETRÔ (Baseado na imagem d45fc2.png) --- */
        .retro-list {
            padding: 15px 15px 15px 30px; /* Dá espaço para os quadrados aparecerem */
            list-style-type: square; /* Marcadores quadrados */
            color: #ff007f; /* Cor do quadrado (rosa) */
            font-family: "Comic Sans MS", "Chalkboard SE", sans-serif;
            font-size: 16px;
            margin: 0;
        }

        .retro-list li {
            margin-bottom: 10px;
        }

        /* Estilo dos links (Roxo brilhante) */
        .retro-list a {
            color: #cc00cc; 
            text-decoration: none;
            font-weight: bold;
        }

        .retro-list a:hover {
            text-decoration: underline;
            color: #ff1493; /* Muda para rosa ao passar o mouse */
        }

        /* Estilo do texto das datas (Rosa) */
        .retro-list span {
            color: #ff007f;
            font-weight: normal;
        }

    </style>
</head>
<body>

<div class="wrapper">
    <!-- Banner Superior -->
    <div class="header-banner"></div>

    <!-- Layout em Colunas -->
    <div class="layout">
        
        <!-- Coluna Esquerda: Sobre Mim -->
        <div class="sidebar-left">
            <img src="images/avatar-pink.jpg" alt="Avatar Rosa" class="profile-pic">
            <div class="title-bar">Sobre mim:</div>
            <div class="profile-info">
                Nome: Júlia Andrade<br>
                RA: 10428513
            </div>
        </div>

        <!-- Coluna Central: Posts -->
        <div class="main-content">
            <div class="title-bar">Posts</div>
            
            <!-- Usando a classe retro-list -->
            <ul class="retro-list">
                <li><a href="#">1. Computação Visual?</a> <span>(12/08/2026)</span></li>
                <li><a href="#">2. Computação Gráfica, Compugrafia ou Compugráfica?</a> <span>(Em breve)</span></li>
            </ul>
        </div>

        <!-- Coluna Direita: Atividades -->
        <div class="sidebar-right">
            <div class="title-bar">Atividades</div>
            
            <!-- Usando a MESMA classe retro-list para manter o padrão -->
            <ul class="retro-list">
                <li><a href="#">Atividade 1</a></li>
                <li><a href="#">Atividade 2</a></li>
                <li><a href="#">Atividade 3</a></li>
            </ul>
        </div>

    </div>
</div>

</body>
</html>
