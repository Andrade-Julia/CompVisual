<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Computação Visual</title>
    <style>
        /* Fundo principal - Mantendo a sua escolha pelas bolinhas */
        body {
            background-color: #ffe6f2;
            background-image: radial-gradient(#ffb3d9 15%, transparent 16%);
            background-size: 20px 20px;
            font-family: Arial, sans-serif; /* Fontes sem serifa eram muito comuns em partes estruturais */
            margin: 0;
            padding: 20px;
            color: #333;
        }

        /* Container que segura tudo para não espalhar muito em telas grandes */
        .wrapper {
            max-width: 900px;
            margin: 0 auto;
        }

        /* O Banner do Gatinho no topo */
        .header-banner {
            width: 100%;
            height: 200px; /* Ajuste a altura conforme a proporção real da sua imagem */
            background-image: url('images/GatinhoCompVisual.png');
            background-size: cover;
            background-position: center;
            margin-bottom: 20px;
            /* Se a imagem não for larga o suficiente, você pode adicionar uma cor de fundo para preencher */
            background-color: #ffccdd; 
        }

        /* Estrutura de três colunas usando Flexbox */
        .layout {
            display: flex;
            gap: 20px; /* Espaço entre as colunas */
            align-items: flex-start; /* Alinha o topo das colunas */
        }

        /* Coluna da Esquerda (Perfil) */
        .sidebar-left {
            width: 200px;
            flex-shrink: 0;
            background-color: rgba(255, 255, 255, 0.5); /* Fundo levemente transparente */
        }

        .profile-pic {
            width: 100%;
            display: block;
            margin-bottom: 5px;
        }

        /* Coluna do Meio (Conteúdo Principal) */
        .main-content {
            flex-grow: 1; /* Ocupa o espaço que sobrar */
            background-color: #ffccdd; /* Fundo rosa sólido para a área de posts */
            min-height: 500px; /* Só para garantir que não fique muito curto se estiver vazio */
        }

        /* Coluna da Direita (Atividades) */
        .sidebar-right {
            width: 150px;
            flex-shrink: 0;
        }

        /* Estilo comum para as barras verdes de título */
        .title-bar {
            background-color: #66cc33; /* O tom de verde da imagem */
            color: white;
            text-align: center;
            padding: 8px 0;
            font-weight: bold;
            font-size: 14px;
            margin: 0; /* Remove margem padrão para grudar nas imagens/caixas */
        }

        /* Texto abaixo da foto de perfil */
        .profile-info {
            font-size: 12px;
            padding: 10px 5px;
            line-height: 1.5;
        }

        /* Lista de Atividades (na coluna da direita) */
        .activities-list {
            list-style: none;
            padding: 10px 0;
            margin: 0;
        }

        .activities-list li {
            margin-bottom: 15px;
            text-align: center;
        }

        /* Transformando os links em botões "gordinhos" (estilo Frutiger Aero/Glossy) */
        .activities-list a {
            display: inline-block;
            width: 40px;
            height: 40px;
            line-height: 40px;
            background-color: #ffb3d9;
            color: #66cc33; /* Texto verde */
            text-decoration: none;
            font-size: 20px;
            font-weight: bold;
            border-radius: 8px; /* Bordas arredondadas */
            /* Efeito de brilho/vidro (glass effect) muito comum nos anos 2000 */
            border: 2px solid #ff99cc;
            box-shadow: inset 0 5px 10px rgba(255,255,255,0.8), 2px 2px 5px rgba(0,0,0,0.2);
        }

        .activities-list a:hover {
            background-color: #ff99cc;
        }

        /* Estilo para a lista de posts na área principal (como você pediu) */
        .post-list {
            padding: 20px;
            list-style-type: none;
        }

        .post-list li {
            margin-bottom: 10px;
            border-bottom: 1px dotted #ff66b2;
            padding-bottom: 5px;
        }

        .post-list a {
            color: #ff1493;
            text-decoration: none;
            font-weight: bold;
        }
        
        .post-list a:hover {
            text-decoration: underline;
        }

    </style>
</head>
<body>

<div class="wrapper">
    <!-- Banner Superior -->
    <div class="header-banner"></div>

    <!-- Layout em Colunas -->
    <div class="layout">
        
        <!-- Coluna Esquerda: Sobre Mim -->
        <div class="sidebar-left">
            <img src="images/avatar-pink.jpg" alt="Avatar Rosa" class="profile-pic">
            <div class="title-bar">Sobre mim:</div>
            <div class="profile-info">
                Nome: Júlia Andrade<br>
                RA: 10428513
            </div>
        </div>

        <!-- Coluna Central: Posts -->
        <div class="main-content">
            <div class="title-bar">Posts</div>
            
            <ul class="post-list">
                <li><a href="#">1. Computação Visual?</a> (12/08/2026)</li>
                <li><a href="#">2. Computação Gráfica, Compugrafia ou Compugráfica?</a> (18/08/2026)</li>
                <li><a href="#">3. Nova Postagem</a> (Em breve)</li>
            </ul>
        </div>

        <!-- Coluna Direita: Atividades -->
        <div class="sidebar-right">
            <div class="title-bar">Atividades</div>
            <ul class="activities-list">
                <!-- Se você quiser os links na forma daqueles botões com números, use isso -->
                <li><a href="#">1</a></li>
                <li><a href="#">2</a></li>
                <li><a href="#">3</a></li>
            </ul>
        </div>

    </div>
</div>

</body>
</html>
